name: "vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'terraform/**' #mean all thing inside terraform folder and subfolder
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    BUCKET_TF_STATE: ${{secrets.BUCKET_TF_STATE}}
    AWS_RGION: "us-east-1"
    EKS_CLUSTER: "vprofile-eks"

jobs:
  terraform:
     name: "Terraform Apply Code Changes"
     runs-on: ubuntu-latest
     defaults:
        run:
          shell: bash
          working-directory: ./terraform
     steps:
        - name: "Checkout Repository"
          uses: actions/checkout@v4
  
        - name: "Setup Terraform"
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: "1.6.3"
  
        - name: "Terraform Init"
          id: "init"
          run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" # store tf state in s3 bucket
  
        - name: "Terraform Format Check"
          id: "fmt"
          run: terraform fmt -check
  
        - name: "Terraform Validate"
          id: "validate"
          run: terraform validate
  
        - name: "Terraform Plan"
          id: "plan"
          run: terraform plan -no-color -input=false -out planfile
          continue-on-error: true
  
        - name: "Terraform pPlan Status"
          if: steps.plan.outcome == 'failure'
          run: exit 1


  
  
